[package]
name = "pelagos-cri"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Kubernetes CRI gRPC server that delegates to the pelagos container runtime"
license = "Apache-2.0"

[[bin]]
name = "pelagos-cri"
path = "src/main.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
clap = { version = "3.1.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio ={ version = "1", features = ["rt", "rt-multi-thread", "sync", "net", "time", "io-util", "process", "fs", "macros", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
uuid = { version = "1", features = ["v4"] }
futures-core = "0.3"
spdystream-rs = "0.1.2"
bytes = "1"
http = "1"
libc = "0.2"
thiserror = "2.0"
sha2 = "0.10"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
tower-layer = "0.3"
tower-service = "0.3"
percent-encoding = "2"
async-trait = "0.1"
containerd-shim-protos = { version = "0.12", features = ["async"] }
ttrpc = { version = "0.10", features = ["async"] }
protobuf = "3.7"
oci-spec = { version = "0.10", default-features = false, features = ["runtime"] }

[dev-dependencies]
# pelagos's own OCI config parser, to prove generated specs are readable by it.
pelagos = { path = ".." }
tempfile = "3"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
serial_test = "3"

[build-dependencies]
tonic-build = "0.12"
